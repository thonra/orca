name: Question
description: Ask about using or contributing to the Orca fork
title: '[Question]: '
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Describe what you are trying to do and what you have already checked.
    validations:
      required: true
