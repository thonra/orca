name: Maintenance task
description: Track fork maintenance such as upstream syncs, releases, or CI changes
title: '[Maintenance]: '
labels:
  - maintenance
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the work and why the fork needs it.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe how to verify the task is complete.
    validations:
      required: true
