name: Fork Release
run-name: Fork release ${{ inputs.version }} (${{ inputs.create_draft && 'draft' || 'validate' }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Fork version (for example, 0.1.0)
        type: string
        required: true
      create_draft:
        description: Upload the verified artifacts to a GitHub Release draft
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'thonra/orca' && github.ref == 'refs/heads/main'
    name: Validate and package source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      archive: ${{ steps.version.outputs.archive }}
    steps:
      - name: Resolve fork tag and asset name
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Use a fork version in the form X.Y.Z, for example 0.1.0.'
            exit 1
          fi
          printf 'tag=thonra-v%s\narchive=orca-thonra-v%s-source.tar.gz\n' "$VERSION" "$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check README links
        run: node config/scripts/static-analysis/repository-layout/check-readme-local-links.mjs

      - name: Create and check the source archive
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          asset_dir="$RUNNER_TEMP/fork-release"
          mkdir -p "$asset_dir"
          git archive --format=tar --prefix="orca-$TAG/" "$GITHUB_SHA" \
            | gzip -n > "$asset_dir/$ARCHIVE"
          cd "$asset_dir"
          gzip -t "$ARCHIVE"
          sha256sum "$ARCHIVE" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fork-release-source
          path: ${{ runner.temp }}/fork-release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  draft:
    if: inputs.create_draft
    needs: archive
    name: Prepare GitHub Release draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: fork-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: fork-release-source
          path: ${{ runner.temp }}/fork-release/

      - name: Verify checksums before uploading
        working-directory: ${{ runner.temp }}/fork-release
        run: sha256sum --check SHA256SUMS

      - name: Create draft for the exact source commit
        shell: bash
        working-directory: ${{ runner.temp }}/fork-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.archive.outputs.tag }}
          ARCHIVE: ${{ needs.archive.outputs.archive }}
        run: |
          releases=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")
          has_release=$(jq --arg tag "$TAG" 'any(.[][]; .tag_name == $tag)' <<< "$releases")
          if [[ "$has_release" == true ]]; then
            echo "::error::A release or draft for $TAG already exists. Check the Releases page."
            exit 1
          fi

          existing_refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq '.[].ref')
          if grep -Fxq "refs/tags/$TAG" <<< "$existing_refs"; then
            echo "::error::Tag $TAG already exists. Use a new release version."
            exit 1
          fi

          notes_flags=(--generate-notes)
          previous_tag=$(jq -r '[.[][] | select((.tag_name | startswith("thonra-v")) and (.draft or .prerelease | not)) | .tag_name][0] // ""' <<< "$releases")
          if [[ -n "$previous_tag" ]]; then
            comparison=$(gh api "repos/$GH_REPO/compare/$previous_tag...$GITHUB_SHA?per_page=1" --jq .status)
            if [[ "$comparison" != ahead ]]; then
              echo "::error::The source commit must advance the last fork release ($previous_tag, comparison $comparison)."
              exit 1
            fi
            notes_flags+=(--notes-start-tag "$previous_tag")
          fi

          notes=$(printf 'Source commit `%s`. This release contains a source archive and SHA-256 checksums.\n\n[Build run](%s/%s/actions/runs/%s).\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID")
          draft_url=$(gh release create "$TAG" "$ARCHIVE" SHA256SUMS \
            --draft --target "$GITHUB_SHA" --title "Orca Fork ${TAG#thonra-v}" \
            --notes "$notes" "${notes_flags[@]}")
          printf 'Review and publish [%s](%s) from GitHub Releases.\n' "$TAG" "$draft_url" >> "$GITHUB_STEP_SUMMARY"
